services:
  postgres:
    image: postgres:17-alpine
    container_name: guardsaab-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: warden_demo
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden_demo_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - warden-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden -d warden_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  warden-postgres-data:
